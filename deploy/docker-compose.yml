services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@hack.nomli-com.ru}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letsencrypt/acme.json

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-logovisor}'
      POSTGRES_USER: '${POSTGRES_USER:-logovisor}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-logovisor}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: '${CLICKHOUSE_USER:-logovisor}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-logovisor}'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: 'postgres://${POSTGRES_USER:-logovisor}:${POSTGRES_PASSWORD:-logovisor}@postgres:5432/${POSTGRES_DB:-logovisor}'
      LOGOVISOR_ENROLLMENT_TOKEN: '${LOGOVISOR_ENROLLMENT_TOKEN:-logovisor-bootstrap-token}'
      LOGOVISOR_ENROLLMENT_TOKEN_TTL_MINUTES: '${LOGOVISOR_ENROLLMENT_TOKEN_TTL_MINUTES:-60}'
      LOGOVISOR_OPERATOR_USERNAME: '${LOGOVISOR_OPERATOR_USERNAME:-admin}'
      LOGOVISOR_OPERATOR_PASSWORD: '${LOGOVISOR_OPERATOR_PASSWORD:-change-me}'
      LOGOVISOR_OPERATOR_JWT_SECRET: '${LOGOVISOR_OPERATOR_JWT_SECRET:-change-me-jwt-secret}'
      LOGOVISOR_OPERATOR_JWT_EXPIRES_IN_SECONDS: '${LOGOVISOR_OPERATOR_JWT_EXPIRES_IN_SECONDS:-28800}'
      LOGOVISOR_OPERATOR_COOKIE_SECURE: '${LOGOVISOR_OPERATOR_COOKIE_SECURE:-true}'
      LOGOVISOR_LOG_RETENTION_DAYS: '${LOGOVISOR_LOG_RETENTION_DAYS:-30}'
      LOGOVISOR_HEARTBEAT_RETENTION_DAYS: '${LOGOVISOR_HEARTBEAT_RETENTION_DAYS:-7}'
      LOGOVISOR_TOKEN_RETENTION_DAYS: '${LOGOVISOR_TOKEN_RETENTION_DAYS:-7}'
      LOGOVISOR_HOUSEKEEPING_INTERVAL_SECONDS: '${LOGOVISOR_HOUSEKEEPING_INTERVAL_SECONDS:-3600}'
      CLICKHOUSE_URL: 'http://${CLICKHOUSE_USER:-logovisor}:${CLICKHOUSE_PASSWORD:-logovisor}@clickhouse:8123/'
      CLICKHOUSE_DATABASE: '${CLICKHOUSE_DATABASE:-default}'
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-13000}:3000'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.logovisor-api.rule=Host(`${TRAEFIK_DOMAIN:-hack.nomli-com.ru}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.logovisor-api.entrypoints=websecure'
      - 'traefik.http.routers.logovisor-api.tls=true'
      - 'traefik.http.routers.logovisor-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.logovisor-api.priority=100'
      - 'traefik.http.routers.logovisor-admin-ui.rule=Host(`${TRAEFIK_DOMAIN:-hack.nomli-com.ru}`) && PathPrefix(`/admin`)'
      - 'traefik.http.routers.logovisor-admin-ui.entrypoints=websecure'
      - 'traefik.http.routers.logovisor-admin-ui.tls=true'
      - 'traefik.http.routers.logovisor-admin-ui.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.logovisor-admin-ui.priority=90'
      - 'traefik.http.services.logovisor-api.loadbalancer.server.port=3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  log-generator:
    build:
      context: ..
      dockerfile: log-generator/Dockerfile
    restart: unless-stopped
    volumes:
      - generated-logs:/var/log/generated
      - /run/systemd/journal/socket:/run/systemd/journal/socket

  agent:
    build:
      context: ..
      dockerfile: agents/Dockerfile
    restart: unless-stopped
    user: '0:0'
    depends_on:
      api:
        condition: service_healthy
      log-generator:
        condition: service_started
    environment:
      LOGOVISOR_MASTER_URL: 'http://api:3000/api'
      LOGOVISOR_BOOTSTRAP_TOKEN: '${LOGOVISOR_ENROLLMENT_TOKEN:-logovisor-bootstrap-token}'
      LOGOVISOR_HOST_ID: '${LOGOVISOR_AGENT_HOST_ID:-docker-agent}'
      LOGOVISOR_LOG_FILE_PATH: '/generated-logs/all.log'
      LOGOVISOR_DB_PATH: '/var/lib/logovisor/agent.db'
      LOGOVISOR_ENABLE_FILE_INPUT: '${LOGOVISOR_ENABLE_FILE_INPUT:-true}'
      LOGOVISOR_ENABLE_JOURNALD: '${LOGOVISOR_ENABLE_JOURNALD:-true}'
      LOGOVISOR_JOURNALD_UNITS: '${LOGOVISOR_JOURNALD_UNITS:-}'
      LOGOVISOR_FLUSH_INTERVAL_SECONDS: '${LOGOVISOR_FLUSH_INTERVAL_SECONDS:-5}'
      LOGOVISOR_HEARTBEAT_INTERVAL_SECONDS: '${LOGOVISOR_HEARTBEAT_INTERVAL_SECONDS:-30}'
    volumes:
      - generated-logs:/generated-logs:ro
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /run/log/journal
        target: /run/log/journal
        read_only: true
        bind:
          create_host_path: true
      - '/etc/machine-id:/etc/machine-id:ro'
      - agent-data:/var/lib/logovisor

volumes:
  postgres-data:
  clickhouse-data:
  agent-data:
  generated-logs:
